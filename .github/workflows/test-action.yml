name: Action smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check known public images
        uses: ./
        with:
          images: |
            alpine:latest
            nextcloud:latest
          platforms: linux/amd64
